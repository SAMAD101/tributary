[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tp-parse = { path = "crates/tp-parse" }
capture = { path = "crates/capture" }
gapdetect = { path = "crates/gapdetect" }
arbiter = { path = "crates/arbiter" }
absplit = { path = "crates/absplit" }
replay = { path = "crates/replay" }
metrics = { path = "crates/metrics" }
store = { path = "crates/store" }

etherparse = "0.21"
pcap-parser = "0.17"
flate2 = "1.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rand_chacha = "0.10"
hdrhistogram = "7.6"
core_affinity = "0.8"
criterion = "0.8"
zstd = "0.13"
rtrb = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
